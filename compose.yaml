services:
  host:
    build:
      context: .
      args:
        UMI_APP_AGENT_BASE_URL: ${UMI_APP_AGENT_BASE_URL:-/api/agent}
        UMI_APP_LOGIN_ENDPOINT: ${UMI_APP_LOGIN_ENDPOINT:-/api/auth/login}
        UMI_APP_LOGIN_URL: ${UMI_APP_LOGIN_URL:-/login}
        UMI_APP_LOGOUT_METHOD: ${UMI_APP_LOGOUT_METHOD:-GET}
        UMI_APP_LOGOUT_URL: ${UMI_APP_LOGOUT_URL:-/api/auth/logout}
        UMI_APP_USER_INFO_URL: ${UMI_APP_USER_INFO_URL:-/api/auth/userinfo}
    environment:
      IDENTITY_LOGIN_PATH: ${IDENTITY_LOGIN_PATH}
      IDENTITY_LOGOUT_PATH: ${IDENTITY_LOGOUT_PATH}
      IDENTITY_ORIGIN: ${IDENTITY_ORIGIN:-http://59.36.5.137:1888}
      IDENTITY_USERINFO_PATH: ${IDENTITY_USERINFO_PATH}
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      agent-server:
        condition: service_healthy
    restart: unless-stopped

  agent-server:
    image: ghcr.io/rookielzy/ek-aiot-agent-server@sha256:f99585f00cfa3476ab365b98667e531189aaa528258ad6b075ef192d62f1ecd6
    environment:
      AGENT_MODEL_PROVIDER: deepseek
      DATABASE_URL: postgresql://agent:${POSTGRES_PASSWORD}@postgres:5432/agent
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-pro}
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: agent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - agent-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  agent-postgres:
